<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plauna layout parity</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: var(--bg-primary, #0a0a0f); color: var(--text-primary, #e4e4e7); }
    /* The stage is the containing block, as a GPU scene host is */
    #stage { position: relative; width: 640px; margin: 16px; }
    #results { padding: 16px; white-space: pre-wrap; }
    /* Page rules for bare elements, in px and in em (no widget uses these elements) */
    dd { margin-inline-start: 24px; }
    h5 { margin-block: 0.5em; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <pre id="results" data-status="running">Running...</pre>
  <script>
    addEventListener('unhandledrejection', event => {
      const results = document.getElementById('results');
      results.dataset.status = 'fail';
      document.documentElement.dataset.testStatus = 'failed';
      results.textContent = `FAIL\n${event.reason?.stack ?? event.reason}`;
    });
  </script>
  <script type="module" src="./plauna-layout-parity.test.js"></script>
</body>
</html>
